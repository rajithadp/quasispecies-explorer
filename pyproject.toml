[project]
name = "quasigraph"
version = "0.1.0"
description = "Prototype: quantify viral quasispecies with a sequence variation graph"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "networkx"]

[project.optional-dependencies]
app = ["streamlit"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
